[workspace]
resolver = "3"
members = ["crates/vault-core", "crates/arca-desktop"]

# Argon2 sin optimizar es lentísimo; así el desbloqueo en `cargo run` tarda lo mismo que en release.
[profile.dev.package.argon2]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
