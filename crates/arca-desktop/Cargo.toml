[package]
name = "arca"
version = "0.1.0"
publish = false
description = "Gestor de contraseñas local y cifrado"
edition = "2024"
build = "build.rs"

[[bin]]
name = "arca"
path = "src/main.rs"

[dependencies]
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dirs = "7.0.0"
futures-channel = "0.3.31"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
slint = "1.18.1"
sys-locale = "0.3.2"
uuid = { version = "1.28.0", features = ["serde"] }
vault-core = { path = "../vault-core" }
zeroize = "1.9.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9.12"

[dev-dependencies]
# Ventana Slint sin pantalla, para probar los controladores.
i-slint-backend-testing = "=1.18.1"
vault-core = { path = "../vault-core", features = ["test-support"] }

[build-dependencies]
slint-build = "1.18.1"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
needless_pass_by_value = "allow"

# Paquete .deb: `cargo deb -p arca` (genera target/debian/arca_<versión>_<arquitectura>.deb).
[package.metadata.deb]
name = "arca"
maintainer = "Eberth <the.jonkey@gmail.com>"
copyright = "Eberth"
section = "utils"
priority = "optional"
# Bibliotecas del sistema que necesita el binario, calculadas con dpkg-shlibdeps.
depends = "$auto"
extended-description = """\
Gestor de contraseñas 100 % local (sin nube ni cuentas): XChaCha20-Poly1305, \
Argon2id y una interfaz nativa con Slint."""
assets = [
    ["target/release/arca", "usr/bin/", "755"],
    ["../../packaging/linux/arca.desktop", "usr/share/applications/", "644"],
    ["../../design/app-icon.svg", "usr/share/icons/hicolor/scalable/apps/arca.svg", "644"],
    ["icons/arca.png", "usr/share/icons/hicolor/512x512/apps/arca.png", "644"],
]
