<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <title>Arca</title>
  <defs>
    <!-- Ámbar cálido: se aleja de los azules habituales en gestores de contraseñas. -->
    <linearGradient id="arca-background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7b955"/>
      <stop offset="1" stop-color="#e2602a"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="220" fill="url(#arca-background)"/>
  <g fill="#231a14">
    <!-- La "A" de Arca, sin travesaño -->
    <path d="M296 776 L512 244 L728 776" fill="none" stroke="#231a14" stroke-width="128" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- El ojo de cerradura ocupa el lugar del travesaño -->
    <circle cx="512" cy="590" r="40"/>
    <path d="M492 606 H532 L546 690 H478 Z"/>
  </g>
</svg>
